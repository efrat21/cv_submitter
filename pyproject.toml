[project]
name = "devbg-job-agent"
version = "0.1.0"
description = "Autonomous DEV.BG job application agent"
requires-python = ">=3.11"
dependencies = [
    "ollama>=0.6.3",
    "playwright>=1.55,<2.0",
]

[project.scripts]
devbg-scrape = "job_agent.main:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_agent"]
